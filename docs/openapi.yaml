openapi: 3.0.3
info:
  title: Tetibola API
  description: >-
    Personal finance management API — transactions, categories, currencies,
    organizations, and user connection tracking.

    Based on the validated MCD: one user owns N transactions,
    each transaction is linked to one currency and N categories.
    Users can own or belong to organizations, and transactions
    can be associated with an organization.
  version: 1.0.0
  contact:
    name: API Support
    email: support@tetibola.com

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://api.tetibola.com/api/v1
    description: Production

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained via `/auth/login`.

  schemas:
    # ──────────── Primitives ────────────
    Error:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
      required:
        - status
        - error
        - message

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 20
        total:
          type: integer
          example: 142
        totalPages:
          type: integer
          example: 8
      required:
        - page
        - perPage
        - total
        - totalPages

    # ──────────── User ────────────
    UserCreateRequest:
      type: object
      required:
        - email
        - lastName
        - username
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: john.doe@email.com
        firstName:
          type: string
          maxLength: 100
          nullable: true
          example: John
        lastName:
          type: string
          maxLength: 100
          example: Doe
        username:
          type: string
          maxLength: 100
          example: jdoe
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          writeOnly: true
          example: s3cur3P@ss

    UserUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
          nullable: true
          example: John
        lastName:
          type: string
          maxLength: 100
          example: Doe
        username:
          type: string
          maxLength: 100
          example: jdoe
      minProperties: 1

    UpdateEmailRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: new.email@domain.com
        password:
          type: string
          format: password
          description: Current password for verification
          example: s3cur3P@ss

    EmailUpdateResponse:
      type: object
      properties:
        message:
          type: string
          example: Email updated successfully
        email:
          type: string
          format: email
          example: new.email@domain.com
      required:
        - message
        - email

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        email:
          type: string
          format: email
          example: john.doe@email.com
        firstName:
          type: string
          nullable: true
          example: John
        lastName:
          type: string
          example: Doe
        username:
          type: string
          example: jdoe
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-06-04T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-04T10:30:00Z'
        lastLoggedInAt:
          type: string
          format: date-time
          example: '2026-06-04T12:00:00Z'
      required:
        - id
        - email
        - lastName
        - username
        - status
        - createdAt
        - updatedAt

    UserProfile:
      description: Public user profile without sensitive or admin fields
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        email:
          type: string
          format: email
          example: john.doe@email.com
        firstName:
          type: string
          nullable: true
          example: John
        lastName:
          type: string
          example: Doe
        username:
          type: string
          example: jdoe
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-06-04T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-04T10:30:00Z'
        lastLoggedInAt:
          type: string
          format: date-time
          example: '2026-06-04T12:00:00Z'
      required:
        - id
        - email
        - lastName
        - username
        - status
        - createdAt
        - updatedAt

    UserStatus:
      type: string
      enum:
        - active
        - inactive
        - locked
      example: active

    # ──────────── Transaction ────────────
    TransactionCreateRequest:
      type: object
      required:
        - amount
        - method
        - type
      properties:
        amount:
          type: number
          format: decimal
          example: 150.00
        title:
          type: string
          maxLength: 100
          nullable: true
          example: Groceries at Carrefour
        description:
          type: string
          nullable: true
          example: Weekly groceries — fruits, vegetables, milk
        date:
          type: string
          format: date-time
          nullable: true
          description: Defaults to the current date
        frequency:
          $ref: '#/components/schemas/TransactionFrequency'
        method:
          $ref: '#/components/schemas/TransactionMethod'
        type:
          $ref: '#/components/schemas/TransactionType'
        expirationDate:
          type: string
          format: date-time
          nullable: true
          description: Only applicable to loans
        currencyUnit:
          $ref: '#/components/schemas/CurrencyUnit'
        categoryNames:
          type: array
          items:
            type: string
            maxLength: 100
          example:
            - Food & Groceries
          description: Category names to associate (optional)
        organizationId:
          type: string
          format: uuid
          nullable: true
          description: Link transaction to an organization
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    TransactionUpdateRequest:
      type: object
      properties:
        amount:
          type: number
          format: decimal
          example: 200.00
        title:
          type: string
          maxLength: 100
          nullable: true
          example: Groceries at Carrefour
        description:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
          nullable: true
        frequency:
          $ref: '#/components/schemas/TransactionFrequency'
        method:
          $ref: '#/components/schemas/TransactionMethod'
        type:
          $ref: '#/components/schemas/TransactionType'
        expirationDate:
          type: string
          format: date-time
          nullable: true
        currencyUnit:
          $ref: '#/components/schemas/CurrencyUnit'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        categoryNames:
          type: array
          items:
            type: string
            maxLength: 100
        organizationId:
          type: string
          format: uuid
          nullable: true
          description: Link transaction to an organization
      minProperties: 1

    TransactionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
          format: decimal
          example: 150.00
        title:
          type: string
          nullable: true
          example: Groceries at Carrefour
        description:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

        frequency:
          $ref: '#/components/schemas/TransactionFrequency'
        method:
          $ref: '#/components/schemas/TransactionMethod'
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        expirationDate:
          type: string
          format: date-time
          nullable: true

        currencyUnit:
          $ref: '#/components/schemas/CurrencyUnit'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategorySummary'
        organizationId:
          type: string
          format: uuid
          nullable: true
          description: Organization this transaction belongs to
      required:
        - id
        - amount
        - date
        - createdAt
        - updatedAt
        - frequency
        - method
        - type
        - status
        - currencyUnit
        - categories

    TransactionStatus:
      type: string
      enum:
        - active
        - inactive
      example: active

    TransactionFrequency:
      type: string
      enum:
        - daily
        - weekly
        - monthly
        - yearly
        - one-time
        - other
      example: one-time

    TransactionMethod:
      type: string
      enum:
        - bank_transfer
        - mobile_money
        - cash
        - card
        - other
      example: card

    TransactionType:
      type: string
      enum:
        - income
        - expense
        - loan
        - other
      example: expense

    SummaryGroupBy:
      type: string
      enum:
        - day
        - week
        - month
        - category
      example: month

    SummaryGroup:
      type: object
      properties:
        key:
          type: string
          description: Group key (date YYYY-MM-DD, ISO week, YYYY-MM, or category name)
          example: "2026-06"
        income:
          type: number
          format: double
          example: 1500.00
        expense:
          type: number
          format: double
          example: 850.50
        loan:
          type: number
          format: double
          example: 200.00
        balance:
          type: number
          format: double
          example: 649.50
        count:
          type: integer
          example: 12
      required:
        - key
        - income
        - expense
        - loan
        - balance
        - count

    TransactionSummaryResponse:
      type: object
      properties:
        totalIncome:
          type: number
          format: double
          example: 5000.00
        totalExpense:
          type: number
          format: double
          example: 3200.00
        totalLoan:
          type: number
          format: double
          example: 800.00
        balance:
          type: number
          format: double
          example: 1800.00
        count:
          type: integer
          example: 42
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SummaryGroup'
      required:
        - totalIncome
        - totalExpense
        - totalLoan
        - balance
        - count
        - groups

    # ──────────── Category ────────────
    CategoryCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: Food & Groceries

    CategoryUpdateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: Food & Dining

    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Food & Groceries
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
        - updatedAt

    CategorySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name

    CurrencyUnit:
      type: string
      enum:
        - EUR
        - MGA
        - USD
        - GBP
        - CHF
        - CAD
        - JPY
        - CNY
        - AUD
        - ZAR
      example: MGA

    # ──────────── Organization ────────────
    OrganizationCreateRequest:
      type: object
      required:
        - name
        - email
        - country
        - contact
      properties:
        name:
          type: string
          maxLength: 100
          example: Acme Corp
        description:
          type: string
          nullable: true
          example: Import/export de produits artisanaux malgaches
        email:
          type: string
          format: email
          maxLength: 100
          example: contact@acmecorp.mg
        country:
          type: string
          maxLength: 100
          example: Madagascar
        contact:
          type: string
          maxLength: 30
          example: +261 34 12 345 67
        taxId:
          type: string
          maxLength: 50
          nullable: true
          description: Tax identification number (NIF, SIRET, EIN…)
          example: 4000012345

    OrganizationUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        email:
          type: string
          format: email
          maxLength: 100
        country:
          type: string
          maxLength: 100
        contact:
          type: string
          maxLength: 30
        taxId:
          type: string
          maxLength: 50
          nullable: true
      minProperties: 1

    OrganizationResponse:
      type: object
      required:
        - id
        - name
        - email
        - country
        - contact
        - status
        - createdAt
        - updatedAt
        - owner
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          example: Acme Corp
        description:
          type: string
          nullable: true
        email:
          type: string
          format: email
        country:
          type: string
        contact:
          type: string
        taxId:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        owner:
          $ref: '#/components/schemas/UserProfile'
          description: The authenticated user who owns this organization
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrganizationStatus:
      type: string
      enum:
        - active
        - inactive
        - locked
      example: active

    OrganizationMemberResponse:
      type: object
      required:
        - user
        - role
        - joinedAt
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
          description: Member user profile
        role:
          $ref: '#/components/schemas/MemberRole'
        joinedAt:
          type: string
          format: date-time

    AddOrganizationMemberRequest:
      type: object
      description: Add a member by email OR username (mutually exclusive, exactly one required)
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          description: Email of the user to add as member
        username:
          type: string
          maxLength: 100
          description: Username of the user to add as member
        role:
          $ref: '#/components/schemas/MemberRole'
      oneOf:
        - required:
            - email
        - required:
            - username

    UpdateMemberRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/MemberRole'

    MemberRole:
      type: string
      enum:
        - admin
        - member
      example: member

    # ──────────── IP Address ────────────
    IpAddressStatus:
      type: string
      enum:
        - active
        - inactive
        - banned
      example: active

    IpAddressResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ipAddress:
          type: string
          example: 192.168.1.1
        status:
          $ref: '#/components/schemas/IpAddressStatus'
        loginAttempt:
          type: integer
          example: 0
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-06-04T12:00:00Z'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - ipAddress
        - status
        - loginAttempt
        - createdAt

    IpAddressStatusUpdate:
      type: string
      enum:
        - inactive
        - banned
      example: inactive

    UpdateIpAddressStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/IpAddressStatusUpdate'

    # ──────────── Auth ────────────
    LoginRequest:
      type: object
      required:
        - password
      properties:
        username:
          type: string
          example: jdoe
        email:
          type: string
          format: email
          example: john.doe@email.com
        password:
          type: string
          format: password
          example: s3cur3P@ss
      oneOf:
        - required:
            - username
        - required:
            - email
      description: Login with either `username` or `email` (at least one required)

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbG...NiIs...
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
        - token
        - user

    RegisterRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/UserCreateRequest'
        - type: object
          properties:
            confirmPassword:
              type: string
              format: password
              description: Must match `password`
          required:
            - confirmPassword

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmPassword
      properties:
        currentPassword:
          type: string
          format: password
          description: Current password for verification
          example: 0ldP@ss123
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          example: N3wS3cur3P@ss
        confirmPassword:
          type: string
          format: password
          description: Must match `newPassword`
          example: N3wS3cur3P@ss

    ForgotPasswordRequest:
      type: object
      required:
        - email
        - recoveryData
      properties:
        email:
          type: string
          format: email
          example: john.doe@email.com
        recoveryData:
          $ref: '#/components/schemas/RecoveryDataResponse'

    ForgotPasswordResponse:
      type: object
      required:
        - message
        - resetToken
        - expiresAt
      properties:
        message:
          type: string
          example: Recovery code accepted. Use the reset token to set a new password.
        resetToken:
          type: string
          description: One-time token valid for 15 minutes
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        expiresAt:
          type: string
          format: date-time
          description: Token expiration timestamp
          example: "2026-06-04T18:30:00Z"

    RecoveryDataResponse:
      type: object
      required:
        - codes
      properties:
        codes:
          type: array
          items:
            type: string
          description: Keep these in a safe place. They won't be shown again.
          example:
            - XK4J-MN92-PL7R-8FT3-BR27-LA1Q
            - QZ95-PD61-WC4X-VN82-GT54-YS6M
            - 3H71-JK48-BD9F-WR65-AC73-FP2N
            - 9E13-LM86-TZ5G-PB45-RS90-VH4W
            - AB12-CD34-EF56-GH78-IJ90-KL12
            - MN34-OP56-QR78-ST90-UV12-WX34
            - YZ56-AB78-CD90-EF12-GH34-IJ56
            - KL78-MN90-OP12-QR34-ST56-UV78

    UserWithRecoveryResponse:
      allOf:
        - $ref: '#/components/schemas/UserResponse'
        - type: object
          required:
            - recoveryData
          properties:
            recoveryData:
              $ref: '#/components/schemas/RecoveryDataResponse'

    RegisterResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbG...NiIs...
        user:
          $ref: '#/components/schemas/UserWithRecoveryResponse'
      required:
        - token
        - user

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          description: Reset token received by email
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          example: N3wS3cur3P@ss
        confirmPassword:
          type: string
          format: password
          description: Must match `newPassword`
          example: N3wS3cur3P@ss

    ResetPasswordResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Password reset successfully

  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 401
            error: Unauthorized
            message: Authentication token is missing or invalid

    Forbidden:
      description: User does not have permission for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 403
            error: Forbidden
            message: You are not allowed to access this resource

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 404
            error: Not Found
            message: The requested resource does not exist

    BadRequest:
      description: Malformed request body or validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 400
            error: Bad Request
            message: Invalid request body

    Unprocessable:
      description: Semantic validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 422
            error: Unprocessable Entity
            message: At least one required field is missing or invalid

security:
  - BearerAuth: []

paths:
  # ──────────── Auth ────────────
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Create a new account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                error: Bad Request
                message: "Malformed request body"
        '409':
          description: Email or username already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 409
                error: Conflict
                message: "Email or username already taken"
        '422':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 422
                error: Unprocessable Entity
                message: "Invalid input data"

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                error: Bad Request
                message: "Malformed request body"
        '401':
          description: Invalid credentials or locked account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                error: Unauthorized
                message: "Invalid credentials or locked account"
        '422':
          description: Neither email nor username provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 422
                error: Unprocessable Entity
                message: "At least one of email or username is required"

  /auth/password-recovery:
    post:
      tags:
        - Authentication
      summary: Reset password using recovery data
      description: >-
        Validates recovery data (backup codes generated at account creation).
        If the email and codes are valid, returns a one-time reset token
        (valid 15 minutes) to be used with /auth/reset-password.
      operationId: passwordRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
