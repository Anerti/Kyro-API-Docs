  /organizations/{organizationId}/members:
    get:
      tags:
        - Organizations
      summary: List organization members
      operationId: listOrganizationMembers
      security:
        - BearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/MemberRole'
          description: Filter by role
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Search by first name or last name
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - joinedAt_asc
              - joinedAt_desc
            default: joinedAt_asc
          description: Sort by join date
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationMemberResponse'
                required:
                  - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags:
        - Organizations
      summary: Add a member
      description: Adds an existing user to the organization by email. Only admins can add members.
      operationId: addOrganizationMember
      security:
        - BearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrganizationMemberRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Member added successfully
        '400':
          description: User not found or already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                error: Bad Request
                message: "User not found or already a member"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

