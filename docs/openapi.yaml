  # ──────────── Transactions ────────────
  /transactions:
    get:
      tags:
        - Transactions
      summary: List transactions
      description: >-
        Returns the authenticated user's transactions.
        Soft-deleted transactions are excluded by default.
      operationId: listTransactions
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TransactionType'
          description: Filter by type
        - name: method
          in: query
          schema:
            $ref: '#/components/schemas/TransactionMethod'
          description: Filter by payment method
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransactionStatus'
          description: Filter by status
        - name: categoryName
          in: query
          schema:
            type: string
            maxLength: 100
          description: Filter by category name
        - name: currencyUnit
          in: query
          schema:
            $ref: '#/components/schemas/CurrencyUnit'
          description: Filter by currency
        - name: frequency
          in: query
          schema:
            $ref: '#/components/schemas/TransactionFrequency'
          description: Filter by frequency
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Search in title and description
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - date
              - -date
              - amount
              - -amount
              - createdAt
              - -createdAt
            default: -date
          description: >-
            Sort field. Prefix with `-` for descending.
            Example: `-date` = most recent first.
      responses:
        '200':
          description: Paginated list of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionResponse'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - data
                  - pagination
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 422
                error: Unprocessable Entity
                message: "Invalid sort value. Allowed: date, -date, amount, -amount, createdAt, -createdAt"
    post:
      tags:
        - Transactions
      summary: Create a transaction
      operationId: createTransaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreateRequest'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Currency or category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                error: Not Found
                message: "Currency or category not found"
        '422':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 422
                error: Unprocessable Entity
                message: "Invalid input data"

